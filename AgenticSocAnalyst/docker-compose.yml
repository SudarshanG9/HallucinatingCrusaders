version: "3.9"

services:
  soc_analyst:
    build: .
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - ./soc_analyst:/app/soc_analyst

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
